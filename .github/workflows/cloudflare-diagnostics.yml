name: Cloudflare connection diagnostics
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cloudflare-diagnostics.yml"
      - "index.html"
      - "functions/**"
      - "worker.js"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Cloudflare and inspect latest Pages deployment
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $CF_API_TOKEN")
          verify=$(curl -fsS "${auth[@]}" https://api.cloudflare.com/client/v4/user/tokens/verify)
          echo "$verify" | jq -e '.success == true' >/dev/null
          echo "Cloudflare token: valid"
          deployments=$(curl -fsS "${auth[@]}" "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects/crypto-ai-market/deployments?per_page=1")
          echo "$deployments" | jq -e '.success == true' >/dev/null
          DEPLOYMENT_ID=$(echo "$deployments" | jq -r '.result[0].id // empty')
          if [ -z "$DEPLOYMENT_ID" ]; then echo "::error::No Pages deployment found"; exit 1; fi
          echo "Latest Pages deployment:"
          echo "$deployments" | jq '.result[0] | {id,short_id,environment,url,created_on,latest_stage,deployment_trigger}'
          project=$(curl -fsS "${auth[@]}" "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects/crypto-ai-market")
          echo "$project" | jq -e '.success == true' >/dev/null
          echo "Configured service-binding names:"
          echo "$project" | jq '.result.deployment_configs // {} | to_entries | map({environment:.key,service_bindings:((.value.services // .value.env.services // {}) | if type == "object" then keys else map(.binding // .name // "unnamed") end)})'
          echo "Configured Worker URL override and binding names:"
          echo "$project" | jq '.result.deployment_configs // {} | to_entries | map({environment:.key,service_bindings:((.value.services // .value.env.services // {}) | if type == "object" then keys else map(.binding // .name // "unnamed") end),variable_names:((.value.vars // []) | if type == "object" then keys else map(.name // "unnamed") end),worker_url_override:((.value.vars // []) | if type == "object" then .MARKET_WORKER_URL else (map(select(.name == "MARKET_WORKER_URL") | .value) | first) end)})'
          echo "Waiting for latest Pages deployment to finish:"
          for attempt in $(seq 1 36); do
            deployments=$(curl -fsS "${auth[@]}" "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects/crypto-ai-market/deployments?per_page=1")
            stage_status=$(echo "$deployments" | jq -r '.result[0].latest_stage.status // ""')
            stage_name=$(echo "$deployments" | jq -r '.result[0].latest_stage.name // ""')
            echo "Pages stage: $stage_name / $stage_status (attempt $attempt)"
            if [ "$stage_status" = "success" ] || [ "$stage_status" = "failure" ]; then break; fi
            sleep 5
          done
          echo "Direct Worker health endpoint:"
          curl -sS -D /tmp/worker_headers "https://crypto-ai-market-worker.bolvalmanus.workers.dev/health" -o /tmp/worker_body || true
          head -n 1 /tmp/worker_headers || true
          cat /tmp/worker_body || true
          echo "Pages Worker health endpoint:"
          curl -sS -D /tmp/health_headers "https://crypto-ai-market.pages.dev/api/worker-health" -o /tmp/health_body || true
          head -n 1 /tmp/health_headers || true
          cat /tmp/health_body || true
